[project]
name = "gnca"
version = "0.1.0"
description = "Neural cellular automata on graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "numpy>=2.5",
    "matplotlib>=3.11",
    "pillow>=12",
    "scikit-learn>=1.9",   # PCA of the hidden channels
    "trackio>=0.34",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gnca"
module-root = "src"

[tool.ruff]
line-length = 96
src = ["src", "scripts"]

[tool.ruff.lint]
# E501 off: the tensor lines read better wide than wrapped
ignore = ["E501"]
